# Cloudflare hosting for this demo.
#
# The site is plain static files - this is NOT a server. Cloudflare's build
# runs Jekyll on every push to main (build command:
# `bundle install && bundle exec jekyll build`), then serves the finished
# _site folder. Jones Uncommon sites are hosted on Cloudflare, not GitHub
# Pages, because Pages isn't allowed to be used as hosting for a paid
# service (see the ops repo, design/hosting-decision.md).
name = "montaire-rally-demo"
compatibility_date = "2026-10-20"

[assets]
directory = "./_site"
# Pages here are folders (/schedule/ -> schedule/index.html), which this
# default serves as-is.
html_handling = "auto-trailing-slash"
