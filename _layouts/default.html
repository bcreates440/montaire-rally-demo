<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><!-- demo only: remove at launch so Google indexes the site -->
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ site.asset_base | append: '/' | append: site.data.assets.og_image | absolute_url }}">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#050d18">
  <link rel="icon" href="{{ site.asset_base | relative_url }}/{{ site.data.assets.favicon }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ site.asset_base | relative_url }}/{{ site.data.assets.icon_192 }}">
  <link rel="apple-touch-icon" href="{{ site.asset_base | relative_url }}/{{ site.data.assets.apple_touch }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
</head>
<body>
{% include header.html %}
<main>
{{ content }}
</main>
{% include footer.html %}
<script src="{{ site.baseurl }}/assets/js/main.js" defer></script>
</body>
</html>
