faq:
    - q: Is the Montaire Rally a race?
      a: No. There are no stopwatches, no timing transponders, and no podiums. It is a grand-touring rally built around the drive, the cars, and the camaraderie.
    - q: Which vehicles can enter?
      a: Four classes are welcome — Vintage Sports Cars, Modern Sports Cars, Vintage Adventure & Touring 4x4, and Supercars & Hypercars. Every vehicle must be exceptionally maintained, clean, street legal, fully insured, and mechanically sound.
    - q: Will the route change?
      a: It can. Weather, road closures, or unforeseen circumstances may force last-minute changes. Organizers put safety first and update drivers through official channels.
    - q: How do I register?
      a: Pick your pass on the Register page and check out securely on Stride — pay, sign the waiver, and add lodging, meals, apparel, and the Coin Quest in one trip.
    - q: Can I give a registration as a gift?
      a: Yes. Stride supports digital gift certificates and promo codes, so a friend can cover someone else's seat.
