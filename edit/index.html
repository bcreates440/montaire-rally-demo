<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Only this site, the two pinned library CDNs and GitHub's API may run or be
     contacted. The site preview inherits this policy and runs no scripts at
     all (sandboxed iframe), so nothing in page content can reach the token. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; connect-src 'self' https://api.github.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self'; base-uri 'self'; form-action 'none'">
<title>Edit your website</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<a class="skip" href="#stage">Skip to the page preview</a>

<header class="bar" id="bar" hidden>
  <div class="bar-left">
    <span class="site-name" id="site-name">Your website</span>
    <label class="field-inline">
      <span>Page</span>
      <select id="page-select" aria-label="Page to edit"></select>
    </label>
  </div>
  <div class="bar-right">
    <div class="seg" role="group" aria-label="Preview size">
      <button type="button" id="view-desktop" aria-pressed="true">Computer</button>
      <button type="button" id="view-mobile" aria-pressed="false">Phone</button>
    </div>
    <a class="btn-quiet" href="../admin/">Advanced editor</a>
  </div>
</header>

<main id="stage" class="stage" tabindex="-1">
  <section class="card-center" id="screen-signin" hidden>
    <h1>Edit your website</h1>
    <p>Sign in to make changes. You'll use the same GitHub account as before.</p>
    <button type="button" class="btn-primary" id="signin">Sign in with GitHub</button>
    <p class="error" id="signin-error" role="alert"></p>
  </section>

  <section class="card-center" id="screen-loading">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text">Opening the editor&hellip;</p>
  </section>

  <div class="frame-wrap" id="frame-wrap" hidden>
    <iframe id="frame" title="Your page" sandbox="allow-same-origin"></iframe>
  </div>
</main>

<p class="status" id="status" role="status" aria-live="polite"></p>

<script type="module" src="editor.js"></script>
</body>
</html>
